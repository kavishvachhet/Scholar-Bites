<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronoVerse  Visual Base</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS + Three.js + GSAP -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <script type="module" src="js/explore.js"></script>


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #111827;
      color: white;
      height: 100vh;
      overflow-x: hidden;
    }

    /* Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    .nav-link {
      position: relative;
      overflow: hidden;
      opacity: 1;
    }

    .nav-link::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #8b45c1, #667eea);
      transition: left 0.3s ease;
    }

    .nav-link:hover::before {
      left: 0;
    }

    /* styles.css */
    .centered-message {
      text-align: center;
      width: 100%;
      padding: 20px;
      font-size: 1.2rem;
      color: #666;
      /* Adjust color as needed */
    }

    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .holographic {
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: holographic-shift 3s ease infinite;
    }

    @keyframes holographic-shift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .characters-section {
      margin-top: 100px;
      padding: 2rem;
      min-height: calc(100vh - 100px);
    }

    .glass-morph {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
    }

    .characters-section h2 {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-filter {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-filter input,
    .search-filter select {
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      flex: 1;
      min-width: 200px;
    }

    .search-filter input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 150px;
    }

    .stat-number {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      color: #4ecdc4;
      margin-bottom: 0.5rem;
    }

    .stat-label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      from {
        text-shadow: 0 0 20px #4ecdc4;
      }

      to {
        text-shadow: 0 0 30px #4ecdc4, 0 0 40px #4ecdc4;
      }
    }

    #characters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .character-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 0;
      transition: all 0.3s ease;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .character-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(78, 205, 196, 0.3);
      border-color: rgba(78, 205, 196, 0.5);
    }

    .character-image-container {
      width: 100%;
      height: 200px;
      overflow: hidden;
      border-radius: 20px 20px 0 0;
      position: relative;
    }

    .character-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .character-card:hover .character-image {
      transform: scale(1.1);
    }

    .character-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px 20px 0 0;
    }

    .placeholder-icon {
      font-size: 4rem;
      opacity: 0.7;
    }

    .character-info {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .character-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #4ecdc4;
      text-align: center;
    }

    .character-details {
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .detail-line {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      min-height: 1.5rem;
    }

    .detail-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4ecdc4;
      min-width: 85px;
      margin-right: 0.5rem;
      flex-shrink: 0;
    }

    .detail-value {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
      word-break: break-word;
    }

    .character-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }

    .btn {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-primary {
      background: linear-gradient(45deg, #4ecdc4, #45b7d1);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
    }

    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      padding: 2rem;
    }

    #story-section {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .story-modal {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .story-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .story-header h3 {
      font-size: 1.8rem;
      color: #4ecdc4;
    }

    .close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    .close-btn:hover {
      color: white;
    }

    #story-content {
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.8;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .story-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    #message-container {
      position: fixed;
      top: 100px;
      right: 20px;
      z-index: 1100;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      color: white;
      font-weight: 500;
      display: none;
      max-width: 300px;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.9);
      border: 1px solid #10b981;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.9);
      border: 1px solid #ef4444;
    }

    .message.info {
      background: rgba(59, 130, 246, 0.9);
      border: 1px solid #3b82f6;
    }

    @media (max-width: 768px) {
      #characters-grid {
        grid-template-columns: 1fr;
      }

      .character-card {
        margin: 0 1rem;
      }

      .detail-line {
        flex-direction: column;
        gap: 0.25rem;
      }

      .detail-label {
        min-width: auto;
      }
    }

    /* Hamburger Menu Button */
#hamburger-btn svg {
  transition: transform 0.3s ease;
}

#hamburger-btn.active svg {
  transform: rotate(90deg);
}

/* Mobile Menu */
#mobile-menu {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

#mobile-menu.show {
  display: flex;
}

/* Ensure nav visibility */
nav {
  display: block !important; /* Ensure nav is always visible */
}

/* Desktop Menu */
.desktop-menu {
  display: none; /* Hidden by default */
}

@media (min-width: 768px) {
  .desktop-menu {
    display: flex !important; /* Show on laptop and larger screens */
  }

  #mobile-menu {
    display: none !important; /* Ensure mobile menu is hidden on laptop */
  }
}

@media (max-width: 768px) {
  .desktop-menu {
    display: none !important; /* Hide desktop menu on mobile */
  }

  .characters-section {
    padding: 1rem;
    margin-top: 80px; /* Adjusted for smaller nav height */
  }

  .search-filter {
    flex-direction: column;
    gap: 0.75rem;
  }

  .search-filter input,
  .search-filter select {
    min-width: 100%;
  }

  .stat-item {
    min-width: 120px;
    padding: 0.75rem;
  }
}

@media (max-width: 480px) {
  .character-name {
    font-size: 1.2rem;
  }

  .btn {
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
  }

  .story-modal {
    padding: 1rem;
    max-height: 90vh;
  }

  .story-header h3 {
    font-size: 1.5rem;
  }

  .story-content {
    font-size: 1rem;
  }
}
  </style>


</head>

<body>
  <!-- 3D Particle Background -->
  <div id="three-canvas" class="w-full h-full"></div>

  <!-- Navigation Bar -->
  <nav class="fixed top-0 left-0 w-full bg-gray-900 bg-opacity-80 backdrop-blur-lg z-50">
  <div class="flex justify-between items-center px-6 md:px-10 py-4">
    <!-- Left Side: Logo -->
    <a href="login.html" class="text-2xl font-bold text-cyan-300 hover:text-white transition-colors">
      ChronoVerse 
    </a>

    <!-- Hamburger Menu Button (Visible on Mobile) -->
    <button id="hamburger-btn" class="block md:hidden text-gray-300 hover:text-white focus:outline-none" aria-label="Toggle navigation">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Desktop Menu -->
    <div class="desktop-menu flex md:flex space-x-6 text-base font-medium">
      <a href="login.html" class="nav-link text-gray-300 hover:text-white transition-colors">Home</a>
      <a href="home.html" id="createBtn" class="nav-link text-gray-300 hover:text-white transition-colors">Create</a>
      <a href="explore.html" id="explorebtn" class="nav-link text-gray-300 hover:text-white transition-colors">Explore</a>
      <!-- Dynamic Auth Links -->
      <div id="auth-links" class="flex space-x-6">
        <!-- Links will be dynamically added here based on auth state -->
      </div>
      <a href="aboutus.html" class="nav-link text-gray-300 hover:text-white transition-colors pr-2 md:pr-2">About</a>
    </div>
  </div>

  <!-- Mobile Menu (Hidden by Default) -->
  <div id="mobile-menu" class="hidden md:hidden flex-col bg-gray-900 bg-opacity-90 backdrop-blur-lg px-6 py-4 space-y-4">
    <a href="login.html" class="nav-link text-gray-300 hover:text-white transition-colors">Home</a>
    <a href="home.html" id="createBtnMobile" class="nav-link text-gray-300 hover:text-white transition-colors">Create</a>
    <a href="explore.html" id="explorebtnMobile" class="nav-link text-gray-300 hover:text-white transition-colors">Explore</a>
    <div id="auth-links-mobile" class="flex flex-col space-y-4">
      <!-- Mobile auth links will be dynamically added here -->
    </div>
    <a href="aboutus.html" class="nav-link text-gray-300 hover:text-white transition-colors">About</a>
  </div>
</nav>

  <!-- Message Container -->
  <div id="message-container"></div>

  <!-- Centered Content -->
  <div class="characters-section glass-morph">
    <h2>Your Characters</h2>
    <div class="search-filter">
      <input type="text" id="search-input" onkeyup="filterCharacters()" placeholder="Search characters..." />
      <select id="universe-filter" onchange="filterCharacters()">
        <option value="">All Universes</option>
        <option value="Marvel">Marvel</option>
        <option value="DC">DC</option>
        <option value="Star Wars">Star Wars</option>
        <option value="Lord of the Rings">Lord of the Rings</option>
        <option value="Harry Potter">Harry Potter</option>
        <option value="Game of Thrones">Game of Thrones</option>
        <option value="Anime">Anime</option>
        <option value="Custom">Custom</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-number pulse-glow" id="total-characters">0</span>
        <span class="stat-label">Total Characters</span>
      </div>
      <div class="stat-item">
        <span class="stat-number pulse-glow" id="universes-count">0</span>
        <span class="stat-label">Universes</span>
      </div>
    </div>

    <!-- Characters Grid -->
    <div id="characters-grid">
      <div class="loading">Loading your characters...</div>
    </div>
  </div>

  <!-- Story Modal -->
  <div id="story-section" class="hidden">
    <div class="story-modal">
      <div class="story-header">
        <h3 id="story-character-name">Character Story</h3>
        <button class="close-btn" onclick="hideStory()">&times;</button>
      </div>
      <div id="story-content">
        No story available
      </div>
      <div class="story-actions">
        <button class="btn btn-primary" onclick="regenerateStory()">Regenerate Story</button>
        <button class="btn btn-secondary" onclick="delstory()" 
        style="background-color: #dc3545; color: white; border-color: #dc3545; position: relative; overflow: hidden; transition: all 0.3s ease;"
        onmouseover="this.style.boxShadow = '0 8px 20px rgba(220, 53, 69, 0.4)'; this.style.transform = 'translateY(-2px)';"
        onmouseout="this.style.boxShadow = 'none'; this.style.transform = 'translateY(0)';">
    Delete Story
</button>
        <button class="btn btn-secondary" onclick="hideStory()">Close</button>
      </div>
    </div>
  </div>

  <!-- Three.js Background Animation -->
  <!-- Add this within the existing <script> tag at the bottom of the second page's <body> -->
  <script>

    
    // Existing Three.js particle background code (unchanged)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('three-canvas').appendChild(renderer.domElement);

    const particleGroups = [];
    const colors = [0x8b45c1, 0x667eea, 0x764ba2, 0xf093fb, 0xf5576c];

    for (let g = 0; g < 2; g++) {
      const count = 300;
      const geo = new THREE.BufferGeometry();
      const posArray = new Float32Array(count * 3);
      const velArray = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 1000;
        velArray[i] = (Math.random() - 0.5) * 1;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      geo.setAttribute('velocity', new THREE.BufferAttribute(velArray, 3));

      const mat = new THREE.PointsMaterial({
        size: Math.random() * 2 + 1,
        color: colors[g % colors.length],
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

      const mesh = new THREE.Points(geo, mat);
      scene.add(mesh);
      particleGroups.push({ mesh, velocities: velArray });
    }

    camera.position.z = 200;

    function animate() {
      requestAnimationFrame(animate);
      particleGroups.forEach((group) => {
        const pos = group.mesh.geometry.attributes.position.array;
        const vel = group.velocities;
        for (let i = 0; i < pos.length; i += 3) {
          pos[i] += vel[i];
          pos[i + 1] += vel[i + 1];
          pos[i + 2] += vel[i + 2];
          if (pos[i] > 500) pos[i] = -500;
          if (pos[i] < -500) pos[i] = 500;
          if (pos[i + 1] > 500) pos[i + 1] = -500;
          if (pos[i + 1] < -500) pos[i + 1] = 500;
          if (pos[i + 2] > 500) pos[i + 2] = -500;
          if (pos[i + 2] < -500) pos[i + 2] = 500;
        }
        group.mesh.geometry.attributes.position.needsUpdate = true;
      });
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Add GSAP animation for the navigation bar
  // const tl = gsap.timeline();
  // tl.from('.nav-link', {
  //   opacity: 0,
  //   y: -50,
  //   duration: 0.8,
  //   stagger: 0.2,
  //   ease: "power2.out"
  // });
  gsap.from('nav', { 
      opacity: 0, 
      y: -50, 
      duration: 1, 
      ease: "power2.out" 
    });
  </script>
</body>

</html>
